    <script>
        (function() {
            const firebaseConfig = {
                apiKey: "AIzaSyC-TWK3E35weTqdw46A8RNWX9lM2GANJbA",
                authDomain: "openplayer-18319.firebaseapp.com",
                projectId: "openplayer-18319",
                storageBucket: "openplayer-18319.firebasestorage.app",
                messagingSenderId: "109099308286",
                appId: "1:109099308286:web:38302196234b7bb52701af",
                measurementId: "G-L66MT3ZTHB"
            };
            firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();
            const db = firebase.firestore();

            const authBtn = document.getElementById('authButton');
            const authLabel = document.getElementById('authLabel');
            const authDropdown = document.getElementById('authDropdown');
            const dropdownProfile = document.getElementById('dropdownProfile');
            const dropdownHistory = document.getElementById('dropdownHistory');
            const dropdownLogout = document.getElementById('dropdownLogout');
            const themeToggle = document.getElementById('themeToggle');
            const logoBtn = document.getElementById('logoBtn');

            const profileName = document.getElementById('profileName');
            const profileEmail = document.getElementById('profileEmail');
            const avatarContainer = document.getElementById('avatarContainer');
            const statMovies = document.getElementById('statMovies');
            const statHours = document.getElementById('statHours');
            const memberSince = document.getElementById('memberSince');
            const historyList = document.getElementById('historyList');
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const backToPlayerBtn = document.getElementById('backToPlayerBtn');

            let currentUser = null;
            let allHistory = [];
            let movieCache = {};
            const OMDB_API = '93691533';
            let searchTimeout = null;

            function getAvatarHtml(user) {
                if (user && user.photoURL) {
                    return `<img src="${user.photoURL}" alt="avatar" onerror="this.parentElement.innerHTML='<i class=\\'fas fa-user\\'></i>'">`;
                }
                return `<i class="fas fa-user"></i>`;
            }

            function formatDate(ts) {
                if (!ts) return '—';
                const d = ts.toDate ? ts.toDate() : new Date(ts);
                const day = String(d.getDate()).padStart(2, '0');
                const month = d.toLocaleString('en-US', { month: 'short' }).toUpperCase();
                const year = d.getFullYear();
                return `${day} ${month} ${year}`;
            }

            async function fetchMovieDetails(id) {
                if (!id) return null;
                if (movieCache[id]) return movieCache[id];
                try {
                    const res = await fetch(`https://www.omdbapi.com/?i=${id}&apikey=${OMDB_API}`);
                    const data = await res.json();
                    if (data.Response === 'True') {
                        const info = {
                            title: data.Title || id,
                            year: data.Year || '',
                            poster: data.Poster && data.Poster !== 'N/A' ? data.Poster : '',
                            imdbRating: data.imdbRating && data.imdbRating !== 'N/A' ? data.imdbRating : ''
                        };
                        movieCache[id] = info;
                        return info;
                    }
                    return null;
                } catch (e) {
                    console.warn('OMDB fetch error:', e);
                    return null;
                }
            }

            function resumeMovie(id, season, episode) {
                if (!id) return;
                const params = new URLSearchParams();
                params.set('id', id);
                if (season > 0) params.set('season', season);
                if (episode > 0) params.set('episode', episode);
                window.location.href = `index.html?${params.toString()}`;
            }

            async function renderHistory(filter = '') {
                const list = allHistory.slice();
                const filtered = filter.trim() ? list.filter(item => {
                    const search = filter.toLowerCase();
                    const title = (item._movieTitle || item.id || '').toLowerCase();
                    const id = (item.id || '').toLowerCase();
                    return title.includes(search) || id.includes(search);
                }) : list;

                const seen = new Set();
                const uniqueFiltered = filtered.filter(item => {
                    if (seen.has(item.id)) return false;
                    seen.add(item.id);
                    return true;
                });

                if (uniqueFiltered.length === 0) {
                    historyList.innerHTML = `
                        <div class="history-empty">
                            <i class="fas fa-clock"></i>
                            <p>${allHistory.length === 0 ? 'No watch history yet.' : 'No matches found.'}</p>
                        </div>
                    `;
                    return;
                }

                const itemsWithDetails = await Promise.all(uniqueFiltered.map(async (item) => {
                    if (!item._movieTitle && item.id) {
                        const info = await fetchMovieDetails(item.id);
                        if (info) {
                            item._movieTitle = info.title;
                            item._year = info.year;
                            item._poster = info.poster;
                            item._imdbRating = info.imdbRating;
                        } else {
                            item._movieTitle = item.id;
                            item._year = '';
                            item._poster = '';
                            item._imdbRating = '';
                        }
                    }
                    return item;
                }));

                historyList.innerHTML = itemsWithDetails.map(item => {
                    const title = item._movieTitle || item.id;
                    const year = item._year || '';
                    const poster = item._poster || '';
                    const rating = item._imdbRating || '';
                    const seasonText = item.season > 0 ? `S${item.season}` : '';
                    const episodeText = item.episode > 0 ? `E${item.episode}` : '';
                    const epLabel = seasonText || episodeText ? `${seasonText} ${episodeText}`.trim() : 'Movie';

                    return `
                        <div class="history-item" data-id="${item.id}" data-season="${item.season || 0}" data-episode="${item.episode || 0}">
                            <div class="history-poster">
                                ${poster ? `<img src="${poster}" alt="${title}" loading="lazy">` : `<i class="fas fa-film"></i>`}
                            </div>
                            <div class="history-info">
                                <div class="history-title">${title} ${year ? `(${year})` : ''}</div>
                                <div class="history-meta">
                                    <span><i class="fas fa-tag"></i> ${item.id}</span>
                                    <span><i class="fas fa-layer-group"></i> ${epLabel}</span>
                                    ${rating ? `<span><i class="fas fa-star" style="color:#f5b342;"></i> ${rating}</span>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                document.querySelectorAll('.history-item').forEach(el => {
                    el.addEventListener('click', function() {
                        const id = this.dataset.id;
                        const season = parseInt(this.dataset.season) || 0;
                        const episode = parseInt(this.dataset.episode) || 0;
                        resumeMovie(id, season, episode);
                    });
                });
            }

            // Auto-search with debounce
            function handleSearchInput() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    renderHistory(searchInput.value);
                }, 300);
            }

            async function loadProfileData(user) {
                if (!user) return;

                profileName.textContent = user.displayName || user.email || 'User';
                profileEmail.textContent = user.email || '';
                avatarContainer.innerHTML = getAvatarHtml(user);

                try {
                    const snapshot = await db.collection('users').doc(user.uid).collection('history')
                        .orderBy('timestamp', 'desc')
                        .limit(200)
                        .get();

                    const history = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        if (data.id) {
                            history.push(data);
                        }
                    });

                    allHistory = history;

                    const uniqueIds = new Set();
                    let totalWatchHours = 0;
                    history.forEach(item => {
                        if (item.id && !uniqueIds.has(item.id)) {
                            uniqueIds.add(item.id);
                            totalWatchHours += 2;
                        }
                    });

                    statMovies.textContent = uniqueIds.size;
                    statHours.textContent = totalWatchHours;

                    if (user.metadata && user.metadata.creationTime) {
                        memberSince.textContent = formatDate(new Date(user.metadata.creationTime));
                    } else {
                        const docSnap = await db.collection('users').doc(user.uid).get();
                        if (docSnap.exists && docSnap.data().createdAt) {
                            memberSince.textContent = formatDate(docSnap.data().createdAt);
                        } else {
                            memberSince.textContent = '—';
                        }
                    }

                    await renderHistory(searchInput.value);
                } catch (err) {
                    console.error('Error loading history:', err);
                    historyList.innerHTML =
                    `<div class="history-empty"><i class="fas fa-exclamation-triangle"></i><p>Error loading history.</p></div>`;
                }
            }

            function updateAuthUI(user) {
                if (user) {
                    const displayName = user.displayName || user.email || 'Account';
                    authLabel.textContent = displayName;
                    authBtn.innerHTML = `<i class="fas fa-user-check"></i> <span id="authLabel">${displayName}</span>`;
                    currentUser = user;
                    loadProfileData(user);
                    authDropdown.classList.remove('active');
                } else {
                    authLabel.textContent = 'Sign in';
                    authBtn.innerHTML = `<i class="fas fa-user"></i> <span id="authLabel">Sign in</span>`;
                    currentUser = null;
                    allHistory = [];
                    historyList.innerHTML =
                        `<div class="history-empty"><i class="fas fa-sign-in-alt"></i><p>Please sign in to view your profile.</p></div>`;
                    profileName.textContent = 'Guest';
                    profileEmail.textContent = 'Not signed in';
                    avatarContainer.innerHTML = `<i class="fas fa-user"></i>`;
                    statMovies.textContent = '0';
                    statHours.textContent = '0';
                    memberSince.textContent = '—';
                    authDropdown.classList.remove('active');
                }
            }

            auth.onAuthStateChanged(user => {
                updateAuthUI(user);
            });

            authBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (currentUser) {
                    authDropdown.classList.toggle('active');
                } else {
                    window.location.href = 'index.html';
                }
            });

            document.addEventListener('click', function(e) {
                if (!e.target.closest('.auth-btn') && !e.target.closest('.auth-dropdown')) {
                    authDropdown.classList.remove('active');
                }
            });

            dropdownProfile.addEventListener('click', function() {
                authDropdown.classList.remove('active');
            });

            dropdownHistory.addEventListener('click', function() {
                authDropdown.classList.remove('active');
                if (currentUser) loadProfileData(currentUser);
            });

            dropdownLogout.addEventListener('click', function() {
                if (confirm('Sign out?')) {
                    auth.signOut();
                    authDropdown.classList.remove('active');
                }
            });

            function setTheme(dark) {
                document.body.classList.toggle('dark', dark);
                const icon = themeToggle.querySelector('i');
                icon.className = dark ? 'fas fa-sun' : 'fas fa-moon';
                localStorage.setItem('theme', dark ? 'dark' : 'light');
            }
            const storedTheme = localStorage.getItem('theme');
            if (storedTheme === 'dark') setTheme(true);
            themeToggle.addEventListener('click', function() {
                setTheme(!document.body.classList.contains('dark'));
            });

            // Auto-search on input with debounce
            searchInput.addEventListener('input', handleSearchInput);

            // Manual search button
            searchBtn.addEventListener('click', function() {
                clearTimeout(searchTimeout);
                renderHistory(searchInput.value);
            });

            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    clearTimeout(searchTimeout);
                    renderHistory(searchInput.value);
                }
            });

            backToPlayerBtn.addEventListener('click', function() {
                window.location.href = 'index.html';
            });

            logoBtn.addEventListener('click', function() {
                window.location.href = 'index.html';
            });

            if (auth.currentUser) {
                loadProfileData(auth.currentUser);
            }

            console.log('Profile page loaded');
        })();
    </script>
</body>
</html>
