<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <meta name="google-site-verification" content="SIhHLFyCpSH9kBdCv8_F3dGjubPpo9MkXsyAh0VoGMM" />
  <title>CineFetch</title>
  <link rel="icon" href="https://i.postimg.cc/YSX9gf2y/3787a1b2-682e-4782-a00a-b8e33dc0a30d-removalai-preview.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    body {
      min-height: 100vh;
      background: #f6f9fc;
      color: #0b1a33;
      display: flex;
      justify-content: center;
      padding: 1.5rem;
      transition: background 0.2s, color 0.2s;
    }
    body.dark {
      background: #0d1424;
      color: #eaf0f8;
    }
    .app {
      max-width: 1280px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    /* header refined */
    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #dce3ed;
    }
    body.dark .header {
      border-bottom-color: #28344e;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: -0.02em;
      cursor: pointer;
      color: #0b1a33;
    }
    body.dark .logo {
      color: #eaf0f8;
    }
    .logo img {
      height: 40px;
      width: auto;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.08);
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    /* ghost / outlined secondary */
    .theme-toggle {
      background: transparent;
      border: 1px solid #cfdcec;
      border-radius: 40px;
      width: 42px;
      height: 42px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2a3d5e;
      transition: 0.2s;
    }
    body.dark .theme-toggle {
      border-color: #3b4a6e;
      color: #cbd8f0;
    }
    .theme-toggle:hover {
      background: #e2ebf6;
      border-color: #9bb1d0;
    }
    body.dark .theme-toggle:hover {
      background: #1f2b44;
      border-color: #5b6f96;
    }
    /* auth button secondary style */
    .auth-btn {
      background: transparent;
      color: #1d3a5c;
      border: 1px solid #bccde0;
      padding: 0.4rem 1.1rem;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      cursor: pointer;
      transition: 0.2s;
      position: relative;
    }
    body.dark .auth-btn {
      color: #d6e3f5;
      border-color: #3e5077;
    }
    .auth-btn:hover {
      background: #e2ebf6;
      border-color: #8aa3c4;
    }
    body.dark .auth-btn:hover {
      background: #1f2b44;
      border-color: #60749e;
    }
    .auth-btn i {
      color: #3b82f6;
    }
    body.dark .auth-btn i {
      color: #5f8ef7;
    }

    /* Tutorial button - prominent */
    .tutorial-btn {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      border: none;
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 12px rgba(59,130,246,0.3);
      white-space: nowrap;
    }
    .tutorial-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 6px 20px rgba(59,130,246,0.4);
    }
    body.dark .tutorial-btn {
      background: linear-gradient(135deg, #4b8bf7, #7777f5);
    }

    /* dropdown with z-index fix */
    .auth-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: #ffffff;
      min-width: 200px;
      border-radius: 20px;
      padding: 0.4rem 0;
      box-shadow: 0 12px 32px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.02);
      border: 1px solid #e3eaf3;
      z-index: 120;
      backdrop-filter: blur(4px);
    }
    body.dark .auth-dropdown {
      background: #1b253f;
      border-color: #31405e;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }
    .auth-dropdown.active {
      display: block;
    }
    .auth-dropdown-item {
      padding: 0.6rem 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
      transition: background 0.1s;
      color: #1d2f4a;
    }
    body.dark .auth-dropdown-item {
      color: #d6e3f5;
    }
    .auth-dropdown-item i {
      width: 20px;
      color: #3b82f6;
    }
    .auth-dropdown-item:hover {
      background: #eff4fa;
    }
    body.dark .auth-dropdown-item:hover {
      background: #283653;
    }

    /* controls card - softer elevation */
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1.2rem;
      background: #ffffffdc;
      backdrop-filter: blur(6px);
      padding: 1.2rem 1.8rem;
      border-radius: 40px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.02), 0 1px 2px rgba(0,0,0,0.03);
      border: 1px solid #eaf0f8;
    }
    body.dark .controls {
      background: #18223bb0;
      backdrop-filter: blur(6px);
      border-color: #2e3d5e;
    }
    .input-group {
      display: flex;
      align-items: center;
      gap: 0.3rem 0.6rem;
      flex-wrap: wrap;
      flex: 1 1 180px;
    }
    .input-group label {
      font-weight: 500;
      font-size: 0.85rem;
      opacity: 0.7;
      display: flex;
      align-items: center;
      gap: 0.2rem;
      color: #1d3a5c;
    }
    body.dark .input-group label {
      color: #b6c9e8;
    }
    .input-group input {
      background: #f0f5fd;
      border: 1px solid #d5e0ee;
      padding: 0.5rem 1rem;
      border-radius: 40px;
      font-size: 0.9rem;
      min-width: 70px;
      flex: 1 0 80px;
      color: #0b1a33;
      transition: 0.15s;
    }
    body.dark .input-group input {
      background: #1b2744;
      border-color: #3b4d72;
      color: #eaf0f8;
    }
    .input-group input:focus {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
      border-color: transparent;
    }
    /* primary CTA - solid blue */
    .load-btn {
      background: #3b82f6;
      border: none;
      color: white;
      padding: 0.55rem 2.2rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      box-shadow: 0 8px 18px rgba(59,130,246,0.25);
      transition: 0.15s;
      white-space: nowrap;
      border: 1px solid #3b82f6;
    }
    .load-btn:hover {
      background: #2563eb;
      transform: scale(1.02);
      box-shadow: 0 10px 24px rgba(59,130,246,0.35);
    }
    .player-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      background: #0b1120;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0,0,0,0.05);
      border: 1px solid #e2eaf3;
    }
    body.dark .player-wrapper {
      border-color: #28344e;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }
    .player-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
    .footer-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      font-size: 0.85rem;
      opacity: 0.6;
      gap: 0.5rem 1rem;
      padding: 0.2rem 0.5rem;
    }
    /* history page */
    .history-page {
      display: none;
      background: #ffffffdc;
      backdrop-filter: blur(4px);
      padding: 2rem 2rem 2.5rem;
      border-radius: 32px;
      border: 1px solid #eaf0f8;
      min-height: 400px;
    }
    body.dark .history-page {
      background: #18223bb0;
      border-color: #2e3d5e;
    }
    .history-page.active {
      display: block;
    }
    .history-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.8rem;
    }
    .history-header h2 {
      font-weight: 600;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .history-header h2 i {
      color: #3b82f6;
    }
    .back-btn {
      background: transparent;
      border: none;
      padding: 0.25rem 0.5rem;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: #2a405e;
      transition: 0.15s;
    }
    body.dark .back-btn {
      color: #b6c9e8;
    }
    .back-btn i {
      font-size: 1.1rem;
    }
    .back-btn:hover {
      color: #3b82f6;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 1.5rem;
      background: #f2f7fe;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid transparent;
    }
    body.dark .history-item {
      background: #1b2744;
    }
    .history-item:hover {
      transform: scale(1.01);
      border-color: #3b82f6;
      background: #e8effa;
    }
    body.dark .history-item:hover {
      background: #283653;
      border-color: #4b6a9a;
    }
    .history-item-info {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .history-item-id {
      font-weight: 600;
      color: #1f3a5c;
    }
    body.dark .history-item-id {
      color: #b6d0f0;
    }
    .history-item-details {
      font-size: 0.85rem;
      opacity: 0.6;
    }
    .history-item-progress {
      font-size: 0.8rem;
      background: #3b82f620;
      padding: 0.2rem 0.9rem;
      border-radius: 30px;
      color: #2563eb;
      font-weight: 500;
    }
    body.dark .history-item-progress {
      background: #2b4170;
      color: #92b0f0;
    }
    .empty-history {
      text-align: center;
      padding: 3rem 1rem;
      opacity: 0.5;
    }
    .empty-history i {
      font-size: 2.8rem;
      margin-bottom: 1rem;
      color: #3b82f6;
    }
    /* popup refined shadows */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .popup-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .popup-card {
      background: #ffffff;
      max-width: 400px;
      width: 100%;
      border-radius: 48px;
      padding: 2.5rem 2rem 2rem;
      box-shadow: 0 24px 48px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.02);
      text-align: center;
      transform: scale(0.96);
      transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1);
      border: 1px solid #eaf0f8;
    }
    body.dark .popup-card {
      background: #19233e;
      color: #eaf0f8;
      border-color: #31405e;
      box-shadow: 0 24px 56px rgba(0,0,0,0.6);
    }
    .popup-overlay.active .popup-card {
      transform: scale(1);
    }
    .popup-card h2 {
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    .popup-card p {
      opacity: 0.6;
      margin-bottom: 1.8rem;
      font-size: 0.95rem;
    }
    .popup-actions {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    .popup-actions button {
      background: #f1f6fd;
      border: 1px solid #dce6f2;
      padding: 0.8rem;
      border-radius: 60px;
      font-weight: 500;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: 0.15s;
      color: #1d3a5c;
    }
    body.dark .popup-actions button {
      background: #1f2b44;
      border-color: #3a4d70;
      color: #d6e3f5;
    }
    .popup-actions .google-btn {
      background: #ffffff;
      border: 1px solid #cddae9;
    }
    body.dark .popup-actions .google-btn {
      background: #1a253f;
      border-color: #3e5177;
    }
    .popup-actions .email-btn {
      background: #3b82f6;
      border: 1px solid #3b82f6;
      color: white;
    }
    .popup-actions .email-btn:hover {
      background: #2563eb;
    }
    .popup-actions .skip-btn {
      background: transparent;
      border: none;
      color: #647a9e;
      font-size: 0.9rem;
    }
    body.dark .popup-actions .skip-btn {
      color: #8ea5cc;
    }
    .popup-actions .skip-btn:hover {
      background: transparent;
      color: #3b82f6;
    }
    .popup-actions button:hover {
      transform: scale(1.01);
    }
    .register-fields {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      margin: 1rem 0 0.6rem;
    }
    .register-fields input {
      padding: 0.7rem 1rem;
      border-radius: 40px;
      border: 1px solid #d5e0ee;
      background: #f0f5fd;
      font-size: 0.95rem;
    }
    body.dark .register-fields input {
      background: #1b2744;
      border-color: #3b4d72;
      color: #eaf0f8;
    }
    .hidden {
      display: none !important;
    }
    @media (max-width: 640px) {
      body { padding: 0.8rem; }
      .controls { padding: 1rem; flex-direction: column; align-items: stretch; }
      .input-group { flex: 1; }
      .load-btn { justify-content: center; }
      .header { flex-direction: column; align-items: stretch; gap: 0.4rem; }
      .actions { justify-content: space-between; }
      .history-item { flex-direction: column; align-items: flex-start; gap: 0.4rem; }
      .popup-card { padding: 2rem 1.5rem; }
      .tutorial-btn { font-size: 0.8rem; padding: 0.3rem 0.9rem; }
      .logo { font-size: 1.1rem; }
      .logo img { height: 32px; }
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #e2eaf3; }
    body.dark ::-webkit-scrollbar-track { background: #1b2744; }
    ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 20px; }
  </style>
</head>
<body>
<div class="app" id="app">

  <header class="header">
    <div class="logo" id="logoBtn">
      <img src="https://i.postimg.cc/YSX9gf2y/3787a1b2-682e-4782-a00a-b8e33dc0a30d-removalai-preview.png" alt="CineFetch">
      <span>CineFetch</span>
    </div>
    <div class="actions">
      <button class="tutorial-btn" id="tutorialBtn"><i class="fas fa-graduation-cap"></i> Tutorial</button>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme"><i class="fas fa-moon"></i></button>
      <div style="position:relative;">
        <button class="auth-btn" id="authButton"><i class="fas fa-user"></i> <span id="authLabel">Sign in</span></button>
        <div class="auth-dropdown" id="authDropdown">
          <div class="auth-dropdown-item" id="dropdownProfile"><i class="fas fa-user"></i> Profile</div>
          <div class="auth-dropdown-item" id="dropdownHistory"><i class="fas fa-clock-rotate-left"></i> Watch History</div>
          <div class="auth-dropdown-item" id="dropdownLogout"><i class="fas fa-sign-out-alt"></i> Logout</div>
        </div>
      </div>
    </div>
  </header>

  <div id="mainView">
    <div class="controls">
      <div class="input-group">
        <label><i class="fas fa-id-card" style="opacity:0.6;"></i> IMDb</label>
        <input type="text" id="imdbInput" placeholder="tt1234567">
      </div>
      <div class="input-group">
        <label><i class="fas fa-layer-group" style="opacity:0.6;"></i> Season</label>
        <input type="number" id="seasonInput" min="1" placeholder="1">
      </div>
      <div class="input-group">
        <label><i class="fas fa-list" style="opacity:0.6;"></i> Episode</label>
        <input type="number" id="episodeInput" min="1" placeholder="1">
      </div>
      <button class="load-btn" id="loadBtn"><i class="fas fa-play"></i> Watch</button>
    </div>

    <div class="player-wrapper" id="playerWrapper">
      <iframe id="videoIframe" src="" allowfullscreen loading="lazy"></iframe>
    </div>
  </div>

  <div class="history-page" id="historyPage">
    <div class="history-header">
      <button class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i> Back</button>
      <h2><i class="fas fa-clock-rotate-left"></i> Watch History</h2>
    </div>
    <div class="history-list" id="historyList">
      <div class="empty-history">
        <i class="fas fa-film"></i>
        <p>No watch history yet. Start watching!</p>
      </div>
    </div>
  </div>

  <!-- Developer Credit -->
  <div style="text-align: center; padding: 1rem 0 0.5rem; opacity: 0.6; font-size: 0.9rem;">
    <p>Developed with <i class="fas fa-heart" style="color: #3b82f6;"></i> by <a href="https://t.me/aura_sajid" target="_blank" rel="noopener noreferrer" style="color: #3b82f6; text-decoration: none; font-weight: 600;">SAJID</a></p>
  </div>
</div>

<div class="popup-overlay" id="loginPopup">
  <div class="popup-card">
    <h2><i class="fas fa-right-to-bracket" style="color:#3b82f6;"></i> Sign in</h2>
    <p id="popupMessage">Sync your watch history across devices.</p>
    <div id="loginForm">
      <div class="register-fields hidden" id="registerFields">
        <input type="text" id="registerName" placeholder="Full Name">
        <input type="email" id="registerEmail" placeholder="Email">
        <input type="password" id="registerPassword" placeholder="Password (6+ chars)">
      </div>
      <div class="popup-actions">
        <button class="google-btn" id="googleLoginBtn"><i class="fab fa-google"></i> Continue with Google</button>
        <button class="email-btn" id="emailLoginBtn"><i class="fas fa-envelope"></i> <span id="emailBtnText">Sign in with Email</span></button>
        <button class="skip-btn" id="skipLoginBtn">Continue without account →</button>
        <button class="skip-btn" id="toggleRegisterBtn" style="font-size:0.85rem;color:#3b82f6;">Create account instead</button>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    const firebaseConfig = {
      apiKey: "AIzaSyC-TWK3E35weTqdw46A8RNWX9lM2GANJbA",
      authDomain: "openplayer-18319.firebaseapp.com",

      storageBucket: "openplayer-18319.firebasestorage.app",

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const iframe = document.getElementById('videoIframe');
    const imdbInput = document.getElementById('imdbInput');
    const seasonInput = document.getElementById('seasonInput');
    const episodeInput = document.getElementById('episodeInput');
    const loadBtn = document.getElementById('loadBtn');
    const themeToggle = document.getElementById('themeToggle');
    const authBtn = document.getElementById('authButton');
    const authLabel = document.getElementById('authLabel');
    const popup = document.getElementById('loginPopup');
    const googleBtn = document.getElementById('googleLoginBtn');
    const emailBtn = document.getElementById('emailLoginBtn');
    const emailBtnText = document.getElementById('emailBtnText');
    const skipBtn = document.getElementById('skipLoginBtn');
    const toggleRegisterBtn = document.getElementById('toggleRegisterBtn');
    const registerFields = document.getElementById('registerFields');
    const registerName = document.getElementById('registerName');
    const registerEmail = document.getElementById('registerEmail');
    const registerPassword = document.getElementById('registerPassword');
    const popupMessage = document.getElementById('popupMessage');
    const authDropdown = document.getElementById('authDropdown');
    const dropdownProfile = document.getElementById('dropdownProfile');
    const dropdownHistory = document.getElementById('dropdownHistory');
    const dropdownLogout = document.getElementById('dropdownLogout');
    const historyPage = document.getElementById('historyPage');
    const historyList = document.getElementById('historyList');
    const backBtn = document.getElementById('backBtn');
    const logoBtn = document.getElementById('logoBtn');
    const mainView = document.getElementById('mainView');
    const tutorialBtn = document.getElementById('tutorialBtn');

    let currentUser = null;
    let watchHistory = { id: '', season: 0, episode: 0 };
    let isLoggedIn = false;
    let skipPopup = false;
    let isRegisterMode = false;
    let allHistory = [];
    let urlParamsHandled = false; // Prevent re-handling on auth change

    function buildEmbedUrl(id, season, episode) {
      if (season && episode && parseInt(season) > 0 && parseInt(episode) > 0) {
        return `https://vaplayer.ru/embed/movie/${id}/${season}/${episode}`;
      }
      return `https://vaplayer.ru/embed/movie/${id}`;
    }

    function updateIframe(id, season, episode, saveHistory = true) {
      if (!id) {
        iframe.src = '';
        return;
      }
      const seasonNum = parseInt(season) || 0;
      const episodeNum = parseInt(episode) || 0;
      const url = buildEmbedUrl(id, seasonNum, episodeNum);
      iframe.src = url;
      
      watchHistory.id = id;
      watchHistory.season = seasonNum;
      watchHistory.episode = episodeNum;
      
      if (saveHistory && isLoggedIn && currentUser) {
        const historyEntry = {
          id: id,
          season: seasonNum,
          episode: episodeNum,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };
        db.collection('users').doc(currentUser.uid).collection('history').add(historyEntry)
          .catch(console.error);
        db.collection('users').doc(currentUser.uid).set({
          displayName: currentUser.displayName || 'User',
          email: currentUser.email,
          lastWatched: watchHistory,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).catch(console.error);
      }
    }

    // Check URL params and load requested movie
    function handleUrlParams() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const season = parseInt(params.get('season')) || 0;
      const episode = parseInt(params.get('episode')) || 0;

      if (id) {
        imdbInput.value = id;
        seasonInput.value = season > 0 ? season : '';
        episodeInput.value = episode > 0 ? episode : '';
        updateIframe(id, season, episode);
        // Clean up URL without reloading
        window.history.replaceState({}, document.title, window.location.pathname);
        return true;
      }
      return false;
    }

    function loadFromHistory(history) {
      if (history && history.id) {
        imdbInput.value = history.id;
        seasonInput.value = history.season || '';
        episodeInput.value = history.episode || '';
        updateIframe(history.id, history.season, history.episode);
        historyPage.classList.remove('active');
        mainView.style.display = 'block';
      }
    }

    function loadWatchHistory() {
      if (!currentUser) {
        historyList.innerHTML = `
          <div class="empty-history">
            <i class="fas fa-sign-in-alt"></i>
            <p>Please sign in to view your watch history.</p>
          </div>
        `;
        return;
      }
      db.collection('users').doc(currentUser.uid).collection('history')
        .orderBy('timestamp', 'desc')
        .limit(50)
        .get()
        .then(snapshot => {
          allHistory = [];
          snapshot.forEach(doc => {
            allHistory.push(doc.data());
          });
          renderHistory();
        })
        .catch(err => {
          console.error('Error loading history:', err);
          historyList.innerHTML = `
            <div class="empty-history">
              <i class="fas fa-exclamation-triangle"></i>
              <p>Error loading history. Please try again.</p>
            </div>
          `;
        });
    }

    function renderHistory() {
      if (allHistory.length === 0) {
        historyList.innerHTML = `
          <div class="empty-history">
            <i class="fas fa-film"></i>
            <p>No watch history yet. Start watching!</p>
          </div>
        `;
        return;
      }
      historyList.innerHTML = allHistory.map(item => {
        const seasonText = item.season > 0 ? `Season ${item.season}` : 'Movie';
        const episodeText = item.episode > 0 ? `Episode ${item.episode}` : '';
        const progress = item.progress || 'Watched';
        return `
          <div class="history-item" data-id="${item.id}" data-season="${item.season || 0}" data-episode="${item.episode || 0}">
            <div class="history-item-info">
              <div class="history-item-id">${item.id}</div>
              <div class="history-item-details">${seasonText} ${episodeText}</div>
            </div>
            <div class="history-item-progress">${progress}</div>
          </div>
        `;
      }).join('');
      document.querySelectorAll('.history-item').forEach(el => {
        el.addEventListener('click', function() {
          const id = this.dataset.id;
          const season = parseInt(this.dataset.season) || 0;
          const episode = parseInt(this.dataset.episode) || 0;
          loadFromHistory({ id, season, episode });
        });
      });
    }

    // Redirect to profile.html
    function goToProfile() {
      window.location.href = 'profile.html';
    }

    loadBtn.addEventListener('click', function() {
      const id = imdbInput.value.trim();
      if (!id) {
        alert('Please enter an IMDb ID');
        return;
      }
      const season = seasonInput.value.trim() === '' ? 0 : parseInt(seasonInput.value);
      const episode = episodeInput.value.trim() === '' ? 0 : parseInt(episodeInput.value);
      updateIframe(id, season, episode);
      historyPage.classList.remove('active');
      mainView.style.display = 'block';
    });

    imdbInput.addEventListener('keypress', e => { if (e.key === 'Enter') loadBtn.click(); });
    seasonInput.addEventListener('keypress', e => { if (e.key === 'Enter') loadBtn.click(); });
    episodeInput.addEventListener('keypress', e => { if (e.key === 'Enter') loadBtn.click(); });

    logoBtn.addEventListener('click', function() {
      historyPage.classList.remove('active');
      mainView.style.display = 'block';
    });
    backBtn.addEventListener('click', function() {
      historyPage.classList.remove('active');
      mainView.style.display = 'block';
    });

    // Tutorial button
    tutorialBtn.addEventListener('click', function() {
      window.location.href = 'tutorial.html';
    });

    function setTheme(dark) {
      document.body.classList.toggle('dark', dark);
      const icon = themeToggle.querySelector('i');
      icon.className = dark ? 'fas fa-sun' : 'fas fa-moon';
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    }
    const storedTheme = localStorage.getItem('theme');
    if (storedTheme === 'dark') setTheme(true);
    themeToggle.addEventListener('click', function() {
      setTheme(!document.body.classList.contains('dark'));
    });

    function updateAuthUI(user) {
      if (user) {
        const displayName = user.displayName || user.email || 'Account';
        authLabel.textContent = displayName;
        authBtn.innerHTML = `<i class="fas fa-user-check"></i> <span id="authLabel">${displayName}</span>`;
        isLoggedIn = true;
        currentUser = user;

        // Only load lastWatched if URL params are NOT present
        if (!urlParamsHandled) {
          db.collection('users').doc(user.uid).get().then(doc => {
            if (doc.exists) {
              const data = doc.data();
              if (data.lastWatched && data.lastWatched.id) {
                watchHistory = data.lastWatched;
                imdbInput.value = watchHistory.id;
                seasonInput.value = watchHistory.season || '';
                episodeInput.value = watchHistory.episode || '';
                updateIframe(watchHistory.id, watchHistory.season, watchHistory.episode, false);
              }
            }
          }).catch(console.error);
        }
        popup.classList.remove('active');
        authDropdown.classList.remove('active');
      } else {
        authLabel.textContent = 'Sign in';
        authBtn.innerHTML = `<i class="fas fa-user"></i> <span id="authLabel">Sign in</span>`;
        isLoggedIn = false;
        currentUser = null;
        allHistory = [];
        // Only show popup if URL params are NOT present
        if (!skipPopup && !urlParamsHandled) {
          setTimeout(() => popup.classList.add('active'), 400);
        }
        authDropdown.classList.remove('active');
      }
    }
    auth.onAuthStateChanged(user => updateAuthUI(user));

    toggleRegisterBtn.addEventListener('click', function() {
      isRegisterMode = !isRegisterMode;
      registerFields.classList.toggle('hidden', !isRegisterMode);
      emailBtnText.textContent = isRegisterMode ? 'Create Account' : 'Sign in with Email';
      toggleRegisterBtn.textContent = isRegisterMode ? 'Back to sign in' : 'Create account instead';
      popupMessage.textContent = isRegisterMode ? 'Create your account' : 'Sync your watch history across devices.';
    });

    emailBtn.addEventListener('click', function() {
      if (isRegisterMode) {
        const name = registerName.value.trim();
        const email = registerEmail.value.trim();
        const password = registerPassword.value;
        if (!name || !email || !password) { alert('Please fill in all fields'); return; }
        if (password.length < 6) { alert('Password must be at least 6 characters'); return; }
        auth.createUserWithEmailAndPassword(email, password)
          .then(result => result.user.updateProfile({ displayName: name }))
          .then(() => {
            const user = auth.currentUser;
            if (user) {
              db.collection('users').doc(user.uid).set({
                displayName: name,
                email: email,
                lastWatched: watchHistory,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
              }).catch(console.error);
            }
            popup.classList.remove('active');
          })
          .catch(err => alert('Registration error: ' + err.message));
      } else {
        const email = prompt('Enter your email:');
        if (email) {
          const password = prompt('Enter your password:');
          if (password) {
            auth.signInWithEmailAndPassword(email, password)
              .catch(err => alert('Login error: ' + err.message));
          }
        }
      }
    });

    googleBtn.addEventListener('click', function() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(e => alert('Google login error: '+e.message));
    });

    skipBtn.addEventListener('click', function() {
      skipPopup = true;
      popup.classList.remove('active');
    });

    authBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (isLoggedIn && currentUser) {
        authDropdown.classList.toggle('active');
      } else {
        popup.classList.add('active');
      }
    });

    dropdownProfile.addEventListener('click', function() {
      authDropdown.classList.remove('active');
      if (currentUser) {
        goToProfile();
      } else {
        popup.classList.add('active');
      }
    });

    dropdownHistory.addEventListener('click', function() {
      authDropdown.classList.remove('active');
      if (currentUser) {
        goToProfile();
      } else {
        popup.classList.add('active');
      }
    });

    dropdownLogout.addEventListener('click', function() {
      if (confirm('Sign out?')) {
        auth.signOut();
        skipPopup = false;
        authDropdown.classList.remove('active');
      }
    });

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.auth-btn') && !e.target.closest('.auth-dropdown')) {
        authDropdown.classList.remove('active');
      }
    });

    popup.addEventListener('click', function(e) {
      if (e.target === popup) {
        popup.classList.remove('active');
        skipPopup = true;
      }
    });

    const link = document.createElement('link');
    link.rel = 'preconnect';
    link.href = 'https://vaplayer.ru';
    document.head.appendChild(link);
    const link2 = document.createElement('link');
    link2.rel = 'dns-prefetch';
    link2.href = 'https://vaplayer.ru';
    document.head.appendChild(link2);

    // ========== INITIALIZATION ==========

    // 1. Handle URL params FIRST (before auth state changes)
    urlParamsHandled = handleUrlParams();

    // 2. If no URL params, wait for auth state to load lastWatched
    // (handled inside updateAuthUI)

    console.log('CineFetch refined | URL params handled:', urlParamsHandled);
  })();
</script>
</body>
</html>
