<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>OpenPlayer</title>
  <!-- Font & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      transition: background-color 0.15s ease, color 0.15s, border-color 0.15s;
    }
    body {
      min-height: 100vh;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      justify-content: center;
      padding: 1.5rem;
    }
    body.dark {
      background: #0b1120;
      color: #e2e8f0;
    }
    .app {
      max-width: 1280px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #d1d5db;
    }
    body.dark .header {
      border-bottom-color: #2d3a5e;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 1.4rem;
      letter-spacing: -0.02em;
    }
    .logo i {
      color: #3b82f6;
      font-size: 1.8rem;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .theme-toggle {
      background: #e2e8f0;
      border: none;
      border-radius: 40px;
      width: 44px;
      height: 44px;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1e293b;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    body.dark .theme-toggle {
      background: #2d3a5e;
      color: #f1f5f9;
    }
    .theme-toggle:hover {
      transform: scale(1.03);
      background: #cbd5e1;
    }
    body.dark .theme-toggle:hover {
      background: #3b4a72;
    }
    .auth-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(59,130,246,0.25);
      transition: 0.15s;
      position: relative;
    }
    .auth-btn:hover {
      background: #2563eb;
      transform: scale(1.01);
    }
    .auth-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      background: white;
      min-width: 200px;
      border-radius: 16px;
      padding: 0.5rem 0;
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
      margin-top: 0.5rem;
      z-index: 100;
    }
    body.dark .auth-dropdown {
      background: #1e293b;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    }
    .auth-dropdown.active {
      display: block;
    }
    .auth-dropdown-item {
      padding: 0.6rem 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      transition: background 0.1s;
    }
    .auth-dropdown-item:hover {
      background: #f1f5f9;
    }
    body.dark .auth-dropdown-item:hover {
      background: #2d3a5e;
    }
    .auth-dropdown-item i {
      width: 20px;
      color: #3b82f6;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 0.75rem 1rem;
      background: #ffffffcc;
      backdrop-filter: blur(4px);
      padding: 1.2rem 1.5rem;
      border-radius: 28px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.03);
      border: 1px solid #e9edf2;
    }
    body.dark .controls {
      background: #1e293bb0;
      backdrop-filter: blur(4px);
      border-color: #33415e;
    }
    .input-group {
      display: flex;
      align-items: center;
      gap: 0.3rem 0.6rem;
      flex-wrap: wrap;
      flex: 1 1 200px;
    }
    .input-group label {
      font-weight: 500;
      font-size: 0.9rem;
      opacity: 0.8;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }
    .input-group input {
      background: #f1f5f9;
      border: 1px solid #d1d9e6;
      padding: 0.5rem 0.9rem;
      border-radius: 40px;
      font-size: 0.9rem;
      min-width: 70px;
      flex: 1 0 80px;
      color: #0f172a;
    }
    body.dark .input-group input {
      background: #1f2a44;
      border-color: #3f5077;
      color: #f1f5f9;
    }
    .input-group input:focus {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
      border-color: transparent;
    }
    .load-btn {
      background: #3b82f6;
      border: none;
      color: white;
      padding: 0.5rem 1.8rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 10px rgba(59,130,246,0.3);
      transition: 0.15s;
      white-space: nowrap;
    }
    .load-btn:hover {
      background: #2563eb;
      transform: scale(1.02);
    }
    .player-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      background: #0b1120;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.1);
      border: 1px solid #e2e8f0;
    }
    body.dark .player-wrapper {
      border-color: #2d3a5e;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
    }
    .player-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
    .footer-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      opacity: 0.75;
      gap: 0.5rem 1rem;
      margin-top: 0.25rem;
      padding: 0.25rem 0.5rem;
    }
    .history-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .history-badge i {
      color: #3b82f6;
    }
    .resume-link {
      color: #3b82f6;
      font-weight: 500;
      cursor: pointer;
      text-decoration: underline dotted;
      text-underline-offset: 4px;
    }
    .resume-link:hover {
      color: #1d4ed8;
    }
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .popup-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .popup-card {
      background: white;
      max-width: 420px;
      width: 100%;
      border-radius: 48px;
      padding: 2.5rem 2rem 2rem;
      box-shadow: 0 30px 60px rgba(0,0,0,0.2);
      text-align: center;
      transform: scale(0.95);
      transition: transform 0.2s;
    }
    body.dark .popup-card {
      background: #1e293b;
      color: #f1f5f9;
    }
    .popup-overlay.active .popup-card {
      transform: scale(1);
    }
    .popup-card h2 {
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .popup-card p {
      opacity: 0.7;
      margin-bottom: 1.8rem;
      font-size: 0.95rem;
    }
    .popup-actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .popup-actions button {
      background: #f1f5f9;
      border: none;
      padding: 0.8rem;
      border-radius: 60px;
      font-weight: 500;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: 0.15s;
    }
    body.dark .popup-actions button {
      background: #2d3a5e;
      color: #f1f5f9;
    }
    .popup-actions .google-btn {
      background: #eef2ff;
      color: #1e293b;
    }
    body.dark .popup-actions .google-btn {
      background: #3b4a72;
      color: white;
    }
    .popup-actions .email-btn {
      background: #3b82f6;
      color: white;
    }
    .popup-actions .email-btn:hover {
      background: #2563eb;
    }
    .popup-actions .skip-btn {
      background: transparent;
      color: #64748b;
      font-size: 0.9rem;
      margin-top: 0.4rem;
    }
    body.dark .popup-actions .skip-btn {
      color: #94a3b8;
    }
    .popup-actions button:hover {
      transform: scale(1.02);
    }
    .hidden {
      display: none !important;
    }
    .register-fields {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin: 1rem 0;
    }
    .register-fields input {
      padding: 0.7rem 1rem;
      border-radius: 40px;
      border: 1px solid #d1d9e6;
      background: #f1f5f9;
      font-size: 0.95rem;
    }
    body.dark .register-fields input {
      background: #1f2a44;
      border-color: #3f5077;
      color: #f1f5f9;
    }
    @media (max-width: 640px) {
      body { padding: 0.8rem; }
      .controls { padding: 1rem; flex-direction: column; align-items: stretch; }
      .input-group { flex: 1; }
      .load-btn { justify-content: center; }
      .header { flex-direction: column; align-items: stretch; gap: 0.5rem; }
      .actions { justify-content: space-between; }
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #e2e8f0; }
    body.dark ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 20px; }
  </style>
</head>
<body>
<div class="app" id="app">

  <header class="header">
    <div class="logo"><i class="fas fa-film"></i> OpenPlayer</div>
    <div class="actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme"><i class="fas fa-moon"></i></button>
      <div style="position:relative;">
        <button class="auth-btn" id="authButton"><i class="fas fa-user"></i> <span id="authLabel">Sign in</span></button>
        <div class="auth-dropdown" id="authDropdown">
          <div class="auth-dropdown-item" id="dropdownProfile"><i class="fas fa-user"></i> Profile</div>
          <div class="auth-dropdown-item" id="dropdownHistory"><i class="fas fa-clock-rotate-left"></i> Watch History</div>
          <div class="auth-dropdown-item" id="dropdownLogout"><i class="fas fa-sign-out-alt"></i> Logout</div>
        </div>
      </div>
    </div>
  </header>

  <div class="controls">
    <div class="input-group">
      <label><i class="fas fa-id-card"></i> IMDb</label>
      <input type="text" id="imdbInput" placeholder="tt1234567">
    </div>
    <div class="input-group">
      <label><i class="fas fa-layer-group"></i> S</label>
      <input type="number" id="seasonInput" min="1" placeholder="1">
    </div>
    <div class="input-group">
      <label><i class="fas fa-list"></i> E</label>
      <input type="number" id="episodeInput" min="1" placeholder="1">
    </div>
    <button class="load-btn" id="loadBtn"><i class="fas fa-play"></i> Watch</button>
  </div>

  <div class="player-wrapper" id="playerWrapper">
    <iframe id="videoIframe" src="" allowfullscreen loading="lazy"></iframe>
  </div>

  <div class="footer-bar">
    <div class="history-badge">
      <i class="fas fa-clock-rotate-left"></i> 
      <span id="historyStatus">No history</span>
      <span id="resumeLink" class="resume-link" style="display:none;">↻ resume</span>
    </div>
    <div><i class="fas fa-circle-info"></i> vaplayer.ru</div>
  </div>
</div>

<div class="popup-overlay" id="loginPopup">
  <div class="popup-card">
    <h2><i class="fas fa-right-to-bracket" style="color:#3b82f6;"></i> Sign in</h2>
    <p id="popupMessage">Sync your watch history across devices.</p>
    <div id="loginForm">
      <div class="register-fields hidden" id="registerFields">
        <input type="text" id="registerName" placeholder="Full Name" required>
        <input type="email" id="registerEmail" placeholder="Email" required>
        <input type="password" id="registerPassword" placeholder="Password (6+ chars)" required>
      </div>
      <div class="popup-actions">
        <button class="google-btn" id="googleLoginBtn"><i class="fab fa-google"></i> Continue with Google</button>
        <button class="email-btn" id="emailLoginBtn"><i class="fas fa-envelope"></i> <span id="emailBtnText">Sign in with Email</span></button>
        <button class="skip-btn" id="skipLoginBtn">Continue without account →</button>
        <button class="skip-btn" id="toggleRegisterBtn" style="font-size:0.85rem;color:#3b82f6;">Create account instead</button>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    const firebaseConfig = {
      apiKey: "AIzaSyC-TWK3E35weTqdw46A8RNWX9lM2GANJbA",
      authDomain: "openplayer-18319.firebaseapp.com",
      projectId: "openplayer-18319",
      storageBucket: "openplayer-18319.firebasestorage.app",
      messagingSenderId: "109099308286",
      appId: "1:109099308286:web:38302196234b7bb52701af",
      measurementId: "G-L66MT3ZTHB"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const iframe = document.getElementById('videoIframe');
    const imdbInput = document.getElementById('imdbInput');
    const seasonInput = document.getElementById('seasonInput');
    const episodeInput = document.getElementById('episodeInput');
    const loadBtn = document.getElementById('loadBtn');
    const themeToggle = document.getElementById('themeToggle');
    const authBtn = document.getElementById('authButton');
    const authLabel = document.getElementById('authLabel');
    const popup = document.getElementById('loginPopup');
    const googleBtn = document.getElementById('googleLoginBtn');
    const emailBtn = document.getElementById('emailLoginBtn');
    const emailBtnText = document.getElementById('emailBtnText');
    const skipBtn = document.getElementById('skipLoginBtn');
    const toggleRegisterBtn = document.getElementById('toggleRegisterBtn');
    const registerFields = document.getElementById('registerFields');
    const registerName = document.getElementById('registerName');
    const registerEmail = document.getElementById('registerEmail');
    const registerPassword = document.getElementById('registerPassword');
    const popupMessage = document.getElementById('popupMessage');
    const historyStatus = document.getElementById('historyStatus');
    const resumeLink = document.getElementById('resumeLink');
    const authDropdown = document.getElementById('authDropdown');
    const dropdownProfile = document.getElementById('dropdownProfile');
    const dropdownHistory = document.getElementById('dropdownHistory');
    const dropdownLogout = document.getElementById('dropdownLogout');

    let currentUser = null;
    let watchHistory = { id: '', season: 0, episode: 0 };
    let isLoggedIn = false;
    let skipPopup = false;
    let isRegisterMode = false;

    function buildEmbedUrl(id, season, episode) {
      if (season && episode && parseInt(season) > 0 && parseInt(episode) > 0) {
        return `https://vaplayer.ru/embed/movie/${id}/${season}/${episode}`;
      }
      return `https://vaplayer.ru/embed/movie/${id}`;
    }

    function updateIframe(id, season, episode) {
      if (!id) {
        iframe.src = '';
        return;
      }
      const seasonNum = parseInt(season) || 0;
      const episodeNum = parseInt(episode) || 0;
      const url = buildEmbedUrl(id, seasonNum, episodeNum);
      iframe.src = url;
      
      watchHistory.id = id;
      watchHistory.season = seasonNum;
      watchHistory.episode = episodeNum;
      
      if (isLoggedIn && currentUser) {
        const userRef = db.collection('users').doc(currentUser.uid);
        userRef.set({
          displayName: currentUser.displayName || 'User',
          email: currentUser.email,
          lastWatched: watchHistory,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).catch(console.error);
      }
      updateHistoryUI();
    }

    function loadFromHistory(history) {
      if (history && history.id) {
        imdbInput.value = history.id;
        seasonInput.value = history.season || '';
        episodeInput.value = history.episode || '';
        updateIframe(history.id, history.season, history.episode);
      }
    }

    function updateHistoryUI() {
      if (watchHistory.id) {
        let displayText = `Last: ${watchHistory.id}`;
        if (watchHistory.season > 0 && watchHistory.episode > 0) {
          displayText += ` S${watchHistory.season} E${watchHistory.episode}`;
        }
        historyStatus.textContent = displayText;
        resumeLink.style.display = 'inline';
      } else {
        historyStatus.textContent = 'No history';
        resumeLink.style.display = 'none';
      }
    }

    // Resume link
    resumeLink.addEventListener('click', function(e) {
      e.preventDefault();
      if (watchHistory.id) {
        imdbInput.value = watchHistory.id;
        seasonInput.value = watchHistory.season || '';
        episodeInput.value = watchHistory.episode || '';
        updateIframe(watchHistory.id, watchHistory.season, watchHistory.episode);
      }
    });

    // Load button
    loadBtn.addEventListener('click', function() {
      const id = imdbInput.value.trim();
      if (!id) {
        alert('Please enter an IMDb ID');
        return;
      }
      const season = seasonInput.value.trim() === '' ? 0 : parseInt(seasonInput.value);
      const episode = episodeInput.value.trim() === '' ? 0 : parseInt(episodeInput.value);
      updateIframe(id, season, episode);
    });

    // Enter key support
    imdbInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') loadBtn.click();
    });
    seasonInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') loadBtn.click();
    });
    episodeInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') loadBtn.click();
    });

    function setTheme(dark) {
      document.body.classList.toggle('dark', dark);
      const icon = themeToggle.querySelector('i');
      if (dark) {
        icon.className = 'fas fa-sun';
      } else {
        icon.className = 'fas fa-moon';
      }
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    }
    const storedTheme = localStorage.getItem('theme');
    if (storedTheme === 'dark') setTheme(true);
    themeToggle.addEventListener('click', function() {
      setTheme(!document.body.classList.contains('dark'));
    });

    function updateAuthUI(user) {
      if (user) {
        const displayName = user.displayName || user.email || 'Account';
        authLabel.textContent = displayName;
        authBtn.innerHTML = `<i class="fas fa-user-check"></i> <span id="authLabel">${displayName}</span>`;
        isLoggedIn = true;
        currentUser = user;
        
        // Load history from Firestore
        db.collection('users').doc(user.uid).get().then(doc => {
          if (doc.exists) {
            const data = doc.data();
            if (data.lastWatched && data.lastWatched.id) {
              watchHistory = data.lastWatched;
              loadFromHistory(watchHistory);
            }
          }
        }).catch(console.error);
        
        popup.classList.remove('active');
        authDropdown.classList.remove('active');
      } else {
        authLabel.textContent = 'Sign in';
        authBtn.innerHTML = `<i class="fas fa-user"></i> <span id="authLabel">Sign in</span>`;
        isLoggedIn = false;
        currentUser = null;
        if (!skipPopup) {
          setTimeout(() => popup.classList.add('active'), 400);
        }
        authDropdown.classList.remove('active');
      }
    }

    auth.onAuthStateChanged(user => {
      updateAuthUI(user);
    });

    // Toggle register mode
    toggleRegisterBtn.addEventListener('click', function() {
      isRegisterMode = !isRegisterMode;
      registerFields.classList.toggle('hidden', !isRegisterMode);
      emailBtnText.textContent = isRegisterMode ? 'Create Account' : 'Sign in with Email';
      toggleRegisterBtn.textContent = isRegisterMode ? 'Back to sign in' : 'Create account instead';
      popupMessage.textContent = isRegisterMode ? 'Create your account' : 'Sync your watch history across devices.';
    });

    // Email login/register
    emailBtn.addEventListener('click', function() {
      if (isRegisterMode) {
        const name = registerName.value.trim();
        const email = registerEmail.value.trim();
        const password = registerPassword.value;
        if (!name || !email || !password) {
          alert('Please fill in all fields');
          return;
        }
        if (password.length < 6) {
          alert('Password must be at least 6 characters');
          return;
        }
        auth.createUserWithEmailAndPassword(email, password)
          .then(result => {
            return result.user.updateProfile({ displayName: name });
          })
          .then(() => {
            const user = auth.currentUser;
            if (user) {
              db.collection('users').doc(user.uid).set({
                displayName: name,
                email: email,
                lastWatched: watchHistory,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
              }).catch(console.error);
            }
            popup.classList.remove('active');
          })
          .catch(err => alert('Registration error: ' + err.message));
      } else {
        const email = prompt('Enter your email:');
        if (email) {
          const password = prompt('Enter your password:');
          if (password) {
            auth.signInWithEmailAndPassword(email, password)
              .catch(err => alert('Login error: ' + err.message));
          }
        }
      }
    });

    googleBtn.addEventListener('click', function() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(e => alert('Google login error: '+e.message));
    });

    skipBtn.addEventListener('click', function() {
      skipPopup = true;
      popup.classList.remove('active');
    });

    authBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (isLoggedIn && currentUser) {
        authDropdown.classList.toggle('active');
      } else {
        popup.classList.add('active');
      }
    });

    // Dropdown actions
    dropdownProfile.addEventListener('click', function() {
      if (currentUser) {
        alert(`Profile\nName: ${currentUser.displayName || 'Not set'}\nEmail: ${currentUser.email}`);
        authDropdown.classList.remove('active');
      }
    });

    dropdownHistory.addEventListener('click', function() {
      if (watchHistory.id) {
        alert(`Watch History\nLast: ${watchHistory.id}\nSeason: ${watchHistory.season || 'N/A'}\nEpisode: ${watchHistory.episode || 'N/A'}`);
      } else {
        alert('No watch history found');
      }
      authDropdown.classList.remove('active');
    });

    dropdownLogout.addEventListener('click', function() {
      if (confirm('Sign out?')) {
        auth.signOut();
        skipPopup = false;
        authDropdown.classList.remove('active');
      }
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.auth-btn') && !e.target.closest('.auth-dropdown')) {
        authDropdown.classList.remove('active');
      }
    });

    popup.addEventListener('click', function(e) {
      if (e.target === popup) {
        popup.classList.remove('active');
        skipPopup = true;
      }
    });

    // Preconnect for faster loading
    const link = document.createElement('link');
    link.rel = 'preconnect';
    link.href = 'https://vaplayer.ru';
    document.head.appendChild(link);
    
    const link2 = document.createElement('link');
    link2.rel = 'dns-prefetch';
    link2.href = 'https://vaplayer.ru';
    document.head.appendChild(link2);

    // Initial state
    updateHistoryUI();
    
    console.log('OpenPlayer ready');
  })();
</script>
</body>
</html>
